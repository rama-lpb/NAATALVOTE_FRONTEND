# NAATALVOTE — Pipeline CI/CD frontend (React 19 / TypeScript / Vite)
name: frontend-ci-cd

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Contrôle qualité (ESLint)
        run: npm run lint -- --max-warnings 0
      - name: Analyse des dépendances de production (bloquante au niveau « high »)
        run: npm audit --audit-level=high
      - name: Vérification TypeScript + build de production
        run: npm run build
        env:
          VITE_API_ORIGIN: ${{ vars.BACKEND_URL }}
          VITE_BUILD_SHA: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist
          retention-days: 30

  deploy-production:
    name: Déploiement Render (après approbation)
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.FRONTEND_URL }}
    steps:
      - name: Déclenchement du déploiement Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK" || { echo "Secret RENDER_DEPLOY_HOOK_FRONTEND absent"; exit 1; }
          curl -fsS -X POST --get --data-urlencode "ref=${GITHUB_SHA}" "$RENDER_DEPLOY_HOOK" > /dev/null
      - name: Vérification de la page d'accueil
        env:
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$FRONTEND_URL" || true)
            echo "Tentative $i : HTTP $code"
            if [ "$code" = "200" ] && curl -fsS "$FRONTEND_URL/version.json" | python3 -c 'import json,sys,os; assert json.load(sys.stdin)["version"] == os.environ["GITHUB_SHA"]'; then
              exit 0
            fi
            sleep 15
          done
          exit 1
